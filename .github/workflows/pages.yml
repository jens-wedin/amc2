# Publishes the game to GitHub Pages.
#
# There is nothing to build: the repo root is already the site, and every
# path in index.html is relative, so it works unchanged from the project
# subpath (https://<user>.github.io/ama/).
#
# One-time setup, and it can only be done by a repo admin: turn on
# Settings -> Pages -> Source = "GitHub Actions". The enablement flag below
# asks the action to create the site itself, but in this repo GITHUB_TOKEN
# is refused ("Resource not accessible by integration"), so the toggle has
# to be flipped by hand. The flag is left on so the workflow starts working
# on its own if that permission is ever granted.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to create the site if it is missing; harmless once it exists.
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # .git and .github are excluded by the action itself
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
