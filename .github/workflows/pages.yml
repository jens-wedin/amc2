# Publishes the game to GitHub Pages.
#
# There is nothing to build: the repo root is already the site, and every
# path in index.html is relative, so it works unchanged from the project
# subpath (https://<user>.github.io/amc2/).
#
# The configure-pages step enables Pages itself on the first run, so there
# is no manual repo setup step.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run if it does not exist yet,
          # so the repo does not have to be configured by hand beforehand.
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # .git and .github are excluded by the action itself
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
